{% extends "base.html" %}
{% block title %}在线工具体验{% endblock %}
{% block content %}
<div class="container py-5">
    <h1 class="section-title mb-5 text-center">在线工具体验</h1>
    <div class="row g-5">
        <!-- 二维码生成 -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-light py-3"><h5>生成</h5></div>
                <div class="card-body p-4">
                    <textarea class="form-control mb-3" id="qr-text" rows="3" 
                        placeholder="输入文本内容"></textarea>
                    <button id="generate-btn" class="btn btn-primary w-100">生成二维码
                    </button>
                    <hr>
                    <div id="qr-result" class="text-center text-muted min-vh-25">
                        结果将在此处显示</div>
                </div>
            </div>
        </div>
        <!-- 二维码解码 -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-light py-3"><h5>解码</h5></div>
                <div class="card-body p-4">
                    <input class="form-control mb-3" type="file" id="qr-file" 
                        accept="image/*">
                    <button id="decode-btn" class="btn btn-success w-100">开始解码
                    </button>
                    <hr>
                    <ul id="decode-result" class="list-group list-group-flush text-muted">
                        结果将在此处显示</ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('generate-btn').addEventListener('click', async () => {
    const text = document.getElementById('qr-text').value.trim();
    if (!text) return alert('请输入文本');
    
    const formData = new FormData();
    formData.append('text', text);
    
    const res = await fetch('/support/tools/generate', {method: 'POST', body: formData});
    if (res.ok) {
        const blob = await res.blob();
        document.getElementById('qr-result').innerHTML = 
            `<img src="${URL.createObjectURL(blob)}" class="img-fluid">`;
    }
});

document.getElementById('decode-btn').addEventListener('click', async () => {
    const file = document.getElementById('qr-file').files[0];
    if (!file) return alert('请选择图片');
    
    const formData = new FormData();
    formData.append('file', file);
    
    const res = await fetch('/support/tools/decode', {method: 'POST', body: formData});
    if (res.ok) {
        const results = await res.json();
        const container = document.getElementById('decode-result');
        container.innerHTML = '';
        if (results.length) {
            results.forEach(text => container.innerHTML += 
                `<li class="list-group-item">${text}</li>`);
        } else {
            container.innerHTML = '未识别到二维码';
        }
    }
});
</script>
{% endblock %}
