{% extends "base.html" %}

{% block title %}申请成功{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
            <div class="alert alert-success p-5 shadow-sm" role="alert">
                <h4 class="alert-heading">
                    <i class="bi bi-check-circle-fill me-2"></i> 投递成功！
                </h4>
                <p>您的申请已成功提交，HR将会尽快审阅您的简历，请耐心等待通知。</p>
                <hr>
                <p class="mb-0">
                    <a href="{{ url_for('get_job_list') }}" class="btn btn-success 
                        me-2">返回招聘列表</a>
                    <a href="{{ url_for('read_root') }}" class="btn 
                        btn-outline-secondary">返回首页</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
